<template>
        <!--Use template if:true to display/hide popup based on isModalOpen value-->
        <template if:true={isModalOpen}>
            <!-- Modal/Popup Box LWC starts here -->
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <!-- Modal/Popup Box LWC header here -->
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close"
                                            alternative-text="close"
                                            variant="inverse"
                                            size="small" ></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Add Rebate</h2>
                    </header>
                    <!-- Modal/Popup Box LWC body starts here -->
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                        <lightning-record-edit-form object-api-name="Deal_Line__c">
                            <lightning-messages>
                            </lightning-messages>
                            <lightning-input-field field-name="RebatedProduct__c"  onchange={handleChange} variant="label-stacked">
                            </lightning-input-field>

                            <lightning-input-field field-name="RebatedQuantity__c" onchange={handleQuantity} value={productItem.RebatedQuantity__c} variant="label-stacked" disabled={readOnly} >
                            </lightning-input-field>
                            <lightning-input-field field-name="RebateMonths__c" onchange={handleChange} value={productItem.RebateMonths__c} variant="label-stacked" disabled={readOnly} >
                            </lightning-input-field>
                            <lightning-input-field field-name="RebateDiscountPercentage__c" onchange={handleDiscount} value={productItem.RebateDiscountPercentage__c} variant="label-stacked" disabled={readOnly} >
                            </lightning-input-field>
                            <lightning-input-field  field-name="RebateDiscountAmount__c"  onchange={handleDiscountAmount} value={productItem.RebateDiscountAmount__c} variant="label-stacked" disabled={readOnly} >
                            </lightning-input-field>

                        </lightning-record-edit-form>
                    </div>
                    <!-- Modal/Popup Box LWC footer starts here -->
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
                        <button class="slds-button slds-button_brand" onclick={submitDetails} title="Add">Add</button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
</template>
