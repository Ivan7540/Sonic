<!-- Deal Approval Info -->
<template>

	<template if:true={isLoading}>
		<lightning-card>
			<div class="slds-is-relative" style="min-height: 177px;">
				<lightning-spinner alternative-text="Loading"></lightning-spinner>
			</div>
		</lightning-card>
	</template>

	<template if:true={error}>
		<c-error-panel errors={error}></c-error-panel>
	</template>

	<template if:true={shouldShowData}>

				<lightning-card title="Rates">
					<lightning-datatable
							hide-checkbox-column=true
							data={dealRates}
							columns={rateColumns}
							key-field="dealLineId"
